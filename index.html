    /* Podstawowe ustawienia */
    body {
      font-family: 'Poppins', sans-serif !important;
      line-height: 1.8;
      text-align: left;
    }
    
    .sidebar {

    .sidebar-nav li>a {
      font-size: 16.5px;
      font-weight: 500;
    }
    
    /* Hierarchia nagłówków (każdy mniejszy o ok. 1.5x od poprzedniego) */

      font-family: 'Poppins', sans-serif !important;
      text-align: left;
      font-weight: 600;
    }
    
    h1 { font-size: 2.25em; }    /* Zazwyczaj bazowo ~3.375em, więc ułamek: 3.375 / 1.5 = 2.25 */
    h2 { font-size: 1.5em; }     /* 2.25 / 1.5 = 1.5 */
    h3 { font-size: 1.0em; }     /* 1.5 / 1.5 = 1.0 */
    h4 { font-size: 0.66em; }    /* 1.0 / 1.5 = 0.66 */
    h5 { font-size: 0.44em; }    /* 0.66 / 1.5 = 0.44 */
    
    /* Czysty, B&W wygląd linków */
    .markdown-section a:not([class]) {
      text-decoration: underline;
      font-weight: 600;
      color: inherit !important; /* Wymuszenie koloru tekstu bazowego (czarny/biały) */
    }

    /* Ikony SVG dziedziczą kolor tekstu (czarno/białe), wersja konturowa */
    svg.ikona-stazu {
      width: 28px;
      height: 28px;
      vertical-align: text-bottom;
      margin-right: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Kolory narzędzi w pasku bocznym */
    .menu-tools { color: #d32f2f !important; }
    .menu-tools-icon { stroke: #d32f2f !important; }
    body.is-dark-mode .menu-tools { color: #ff5252 !important; }
    body.is-dark-mode .menu-tools-icon { stroke: #ff5252 !important; }

    /* Iframe domyślnie (jasny motyw) */
    iframe {
      background-color: white; /* Baza dla dokumentów google */
      transition: filter 0.3s ease;
    }
    
    /* Iframe w trybie ciemnym (dodawane przez JS) */
    body.is-dark-mode iframe {
      filter: invert(0.92) hue-rotate(180deg) contrast(0.9);
    }

    /* Usunięcie tytułu "Czeladź Staż" z samego sidebara */
    .app-name {
      display: none !important;
    }

  <script>
    function updateIframeTheme() {
      const isDark = localStorage.getItem('DARK_LIGHT_THEME') === 'dark';
      document.body.classList.toggle('is-dark-mode', isDark);
    }
    
    window.addEventListener('load', () => {
      updateIframeTheme(); // Ustaw od razu po załadowaniu
      
      // Nasłuchuj kliknięć gdziekolwiek na stronie (głównie na #docsify-darklight-theme)
      document.addEventListener('click', (e) => {
        // Opóźnienie 50ms, żeby wtyczka darklightTheme najpierw zdążyła zapisać status w localStorage
        if(e.target.closest('#docsify-darklight-theme') || e.target.id === 'docsify-darklight-theme') {
          setTimeout(updateIframeTheme, 50);
        }
      });
    });
  </script>

  <script>
    // --- Kalkulator BMI ---
    window.obliczBMI = function() {
      let w = document.getElementById('waga').value.replace(',', '.');
      let h = document.getElementById('wzrost').value.replace(',', '.');
      if(!w || !h) {
        document.getElementById('wynik-box').style.display = 'none';
        return;
      }
      w = parseFloat(w);
      h = parseFloat(h);
      if(isNaN(w) || isNaN(h) || w <= 0 || h <= 0) {
        document.getElementById('wynik-box').style.display = 'none';
        return;
      }

      if(h > 3) h = h / 100;

      let bmi = w / (h * h);
      let wynikBox = document.getElementById('wynik-box');
      let wynikLiczba = document.getElementById('wynik-liczba');
      let wynikTekst = document.getElementById('wynik-tekst');

      wynikBox.style.display = 'block';
      wynikLiczba.innerText = "BMI: " + bmi.toFixed(2);

      let kol = "#000";
      let txt = "";
      if(bmi < 18.5) {
        txt = "Niedowaga"; kol = "#3498db"; 
      } else if(bmi >= 18.5 && bmi < 25) {
        txt = "Waga prawidłowa"; kol = "#2ecc71";
      } else if(bmi >= 25 && bmi < 30) {
        txt = "Nadwaga"; kol = "#f1c40f";
      } else if(bmi >= 30 && bmi < 35) {
        txt = "Otyłość I stopnia"; kol = "#e67e22";
      } else if(bmi >= 35 && bmi < 40) {
        txt = "Otyłość II stopnia"; kol = "#e74c3c";
      } else {
        txt = "Otyłość skrajna (III stopnia)"; kol = "#c0392b";
      }

      wynikBox.style.backgroundColor = kol;
      wynikBox.style.color = "#fff";
      wynikTekst.innerText = txt;
    };

    // --- Statusy Chirurgia ---
    function val(id) {
        let el = document.getElementById(id);
        return el ? el.value : "";
    }
    function isChecked(id) {
        let el = document.getElementById(id);
        return el ? el.checked : false;
    }
    function radio(name) {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        if(!el) return "";
        const genderEl = document.querySelector(`input[name="gender"]:checked`);
        const gender = genderEl ? genderEl.value : "M";
        if(gender === "K" && el.getAttribute("data-f")) {
            return el.getAttribute("data-f");
        }
        return el.value;
    }

    window.generujStatus = function() {
        let out = [];
        const date = new Date().toLocaleDateString('pl-PL');
        const time = new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'});
        
        let pacjent = val("patient_name") || "__________________";
        out.push(`STATUS LEKARSKI - CHIRURGIA`);
        out.push(`Data: ${date} ${time}`);
        out.push(`Pacjent: ${pacjent}`);
        out.push(``);
        
        if(isChecked("inc_doba")) {
            let doba = `Doba hospitalizacji: ${val("doba_hosp")} | Doba po zabiegu: ${val("doba_zabieg")}`;
            if(val("nazwa_zabiegu")) doba += ` (zabieg: ${val("nazwa_zabiegu")})`;
            out.push(doba);
        }
        
        if(isChecked("inc_stan_og")) out.push(`Stan ogólny: ${radio("stan_ogolny")}`);
        if(isChecked("inc_swiadomosc")) out.push(`Świadomość: ${radio("swiadomosc")}`);
        
        if(isChecked("inc_kraz_odd")) {
            let ko = `Układ krążenia i oddechowy: ${radio("kraz_odd")}`;
            if(val("tlenoterapia")) ko += ` (tlenoterapia: ${val("tlenoterapia")})`;
            out.push(ko);
        }
        
        if(isChecked("inc_parametry")) {
            let param = `Parametry: RR: ${val("param_rr")} mmHg | HR: ${val("param_hr")} /min | SpO2: ${val("param_spo2")}% | Temp: ${val("param_temp")} °C`;
            if(val("param_diureza")) param += ` | Diureza: ${val("param_diureza")} ml`;
            out.push(param);
        }
        
        if(isChecked("inc_dolegliwosci")) {
            let d = `Dolegliwości: ${radio("dolegliwosci")}`;
            if(radio("dolegliwosci") === "ból operowanej okolicy") d += ` (NRS: ${val("nrs_bol")})`;
            out.push(d);
        }
        
        if(isChecked("inc_dieta")) out.push(`Dieta: ${radio("dieta")}`);
        
        if(isChecked("inc_pp")) {
            out.push(`Przewód pokarmowy: ${radio("gazy")} | ${radio("stolec")}`);
        }
        
        out.push(``);
        out.push(`BADANIE PRZEDMIOTOWE:`);
        if(isChecked("inc_klatka")) out.push(`- Klatka piersiowa: ${radio("klatka")}`);
        if(isChecked("inc_powloki")) out.push(`- Powłoki brzuszne: ${radio("powloki")}`);
        if(isChecked("inc_palpacja")) out.push(`- Palpacja brzucha: ${radio("palpacja1")} | ${radio("palpacja2")}`);
        if(isChecked("inc_otrzewna")) out.push(`- Objawy otrzewnowe: ${radio("otrzewna")}`);
        if(isChecked("inc_perystaltyka")) out.push(`- Perystaltyka: ${radio("perystaltyka")}`);
        
        out.push(``);
        out.push(`STAN MIEJSCOWY:`);
        if(isChecked("inc_rana")) {
            let r = `- Rana operacyjna: ${radio("rana")}`;
            if(radio("rana") === "wyciek treści") {
                let tr = [];
                if(isChecked("rana_tre_surowicza")) tr.push("surowiczej");
                if(isChecked("rana_tre_krwista")) tr.push("krwistej");
                if(isChecked("rana_tre_ropna")) tr.push("ropnej");
                if(tr.length) r += ` ${tr.join(", ")}`;
            }
            let dodatki = [];
            if(isChecked("rana_rozejscie")) dodatki.push("rozejście brzegów");
            if(isChecked("rana_krwiak")) dodatki.push("krwiak");
            if(isChecked("rana_obrzek")) dodatki.push("obrzęk i zaczerwienienie");
            if(dodatki.length) r += ` | ` + dodatki.join(", ");
            out.push(r);
        }
        if(isChecked("inc_dren")) {
            let dr = `- Dren: ${radio("dren")}`;
            if(radio("dren") === "obecny") {
                let tr2 = [];
                if(isChecked("dren_tre_sur")) tr2.push("surowicza");
                if(isChecked("dren_tre_krw")) tr2.push("krwista");
                if(isChecked("dren_tre_zol")) tr2.push("żółciowa");
                if(isChecked("dren_tre_jel")) tr2.push("jelitowa");
                if(isChecked("dren_tre_rop")) tr2.push("ropna");
                if(tr2.length) dr += ` ` + tr2.join(", ");
                if(val("dren_obj")) dr += ` | objętość: ${val("dren_obj")} ml`;
            }
            out.push(dr);
        }
        if(isChecked("inc_naczynie")) out.push(`- Dostęp naczyniowy: ${radio("naczynie")} | ${radio("zapalenie")}`);
        if(isChecked("inc_mocz")) {
            let m = `- Pęcherz moczowy: ${radio("mocz")}`;
            m += ` (${radio("mocz_cecha")})`;
            out.push(m);
        }
        
        out.push(``);
        out.push(`PLAN I ZALECENIA:`);
        if(isChecked("inc_leczenie")) {
            let l = `- Leczenie: ${radio("leczenie")}`;
            if(radio("leczenie") === "modyfikacja zleceń" && val("mod_zlec")) l += ` ${val("mod_zlec")}`;
            out.push(l);
        }
        if(isChecked("inc_zywienie")) out.push(`- Żywienie: ${radio("zywienie")}`);
        if(isChecked("inc_uruchamianie")) out.push(`- Uruchamianie: ${radio("uruchamianie")}`);
        if(isChecked("inc_procedury")) {
            let pr = [];
            if(isChecked("proc_toaleta")) pr.push("toaleta rany i zmiana opatrunku");
            if(isChecked("proc_dren")) pr.push("usunięcie drenu");
            if(isChecked("proc_foley")) pr.push("usunięcie cewnika Foleya");
            if(isChecked("proc_szwy")) pr.push("usunięcie szwów");
            if(pr.length) out.push(`- Procedury: ${pr.join(", ")}`);
        }
        if(isChecked("inc_diagnostyka")) {
            let di = [];
            if(isChecked("diag_lab")) di.push("kontrola badań laboratoryjnych");
            if(isChecked("diag_obraz")) {
                let txt = "badania obrazowe";
                if(val("diag_obraz_txt")) txt += ` (${val("diag_obraz_txt")})`;
                di.push(txt);
            }
            if(di.length) out.push(`- Diagnostyka: ${di.join(", ")}`);
        }
        if(isChecked("inc_decyzja")) {
            let dec = `- Decyzja: ${radio("decyzja")}`;
            if(radio("decyzja") === "kwalifikacja do wypisu" && val("wypis_txt")) dec += ` (${val("wypis_txt")})`;
            out.push(dec);
        }
        
        if(val("dodatkowe_info")) {
            out.push(``);
            out.push(`Uwagi dodatkowe: ${val("dodatkowe_info")}`);
        }
        
        const finalStatus = out.join("\n");
        
        const textarea = document.getElementById("output-status");
        if(textarea) textarea.value = finalStatus;
        
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(finalStatus).catch(err => {
                if(textarea) { textarea.select(); document.execCommand('copy'); }
            });
        } else {
            if(textarea) { textarea.select(); document.execCommand('copy'); }
        }
        alert("Status pomyślnie wygenerowany! Właśnie pobrano plik tekstowy (.txt) i skopiowano go do schowka.");
        
        // --- POBIERANIE JAKO ZWYKŁY PLIK TEKSTOWY (.txt) ---
        const blob = new Blob([finalStatus], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        let safeName = pacjent.trim().replace(/[^a-zA-Z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ ]/g, "").replace(/\s+/g, "_");
        if(safeName === "__________________" || !safeName) safeName = "Nieznany";
        
        a.href = url;
        a.download = `Status_${safeName}.txt`;
        document.body.appendChild(a);
        a.click();
        
        // Sprzątanie po pobraniu
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            let form = document.getElementById("chirurgia-form");
            if(form) form.reset();
        }, 100);
    };
  </script>

<script>
function updateGuide() {
    let cukrzyca = document.getElementById("q_cukrzyca") ? document.getElementById("q_cukrzyca").checked : false;
    let tarczyca = document.getElementById("q_tarczyca") ? document.getElementById("q_tarczyca").checked : false;
    let cisnienie = document.getElementById("q_cisnienie") ? document.getElementById("q_cisnienie").checked : false;
    let grupa = document.getElementById("q_grupa") ? document.getElementById("q_grupa").checked : false;
    let poranny = document.getElementById("q_poranny") ? document.getElementById("q_poranny").checked : false;
    let wiek = document.getElementById("q_wiek") ? document.getElementById("q_wiek").checked : false;
    let caprini = document.getElementById("q_caprini") ? document.getElementById("q_caprini").checked : false;
    let zabieg = document.getElementById("q_zabieg") ? document.getElementById("q_zabieg").value : "inny";

    let out = "";

    out += "<div class='guide-step'>";
    out += "<h3>1️⃣ Rejestracja i wywiad o lekach (na Izbie)</h3>";
    out += "<ul>";
    out += "<li>Podejdź do rejestratorek po <strong>koperty</strong> zarejestrowanych pacjentów.</li>";
    out += "<li>Poproś pacjentów o <strong>listę leków</strong> (co i kiedy odstawione).</li>";
    out += "<li><strong class='highlight-red'>Bezwzględnie sprawdź odstawienie leków:</strong><br>";
    out += " - <em>p/płytkowe (5-7 dni):</em> Acard, Polocard, Plavix, Areplex, itp.<br>";
    out += " - <em>p/krzepliwe (5-7 dni):</em> Warfin, Acenokumarol<br>";
    out += " - <em>p/krzepliwe (2-3 dni):</em> Pradaxa, Eliquis, Xarelto (Mibrex)<br>";
    out += " - <em>p/cukrzycowe (7 dni):</em> Ozempic, Mounjaro<br>";
    out += " - <em>p/cukrzycowe (2-3 dni):</em> Jardiance, Forxiga</li>";
    out += "<li>Zastrzyki Clexane/Neoparin są DOZWOLONE.</li>";
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>2️⃣ Wpisz w system (Rozpoznanie i Uzasadnienie)</h3>";
    out += "<ul>";
    out += "<li><strong>Obserwacja (gotowiec):</strong> ";
    if (zabieg === "endoskopia") out += "Wpisz <em>'kolo/kolo K'</em> lub <em>'gastro'</em>.";
    else out += "Wpisz <em>'przyjęcie/przyjęcie K'</em>.";
    out += "</li>";
    out += "<li><strong>Rozpoznanie przy przyjęciu:</strong> Odczytaj chorobę z koperty (zakładka ICD-10) i wklej/wpisz.</li>";
    out += "<li><strong>Uzasadnienie (Powód przyjęcia):</strong> ";
    if (zabieg === "endoskopia") out += "Wpisz: <em>'do kolono-/gastroskopii/ecpw...'</em> (w przypadku endoskopii należy napisać powód przyjęcia!)";
    else if (zabieg === "ostry") out += "Wpisz: <em>'konieczne leczenie szpitalne'</em>";
    else out += "Wpisz: <em>'do zabiegu operacyjnego'</em>";
    out += "</li>";
    if (zabieg === "przepuklina") {
        out += "<li><strong>Skróty do przepuklin:</strong> HID (pachw. pr.), HIS (pachw. lewa), HIB (obustr.), HU (pępkowa), HV (brzuszna).</li>";
    } else if (zabieg === "rak" || zabieg === "jelito") {
        out += "<li><strong>Skróty onkologiczne:</strong> CA (rak), Recti (prostnica), Sigmoidei (esica), Ceci (kątnica).</li>";
    }
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>3️⃣ Zleć Badania i Konsultacje w systemie</h3>";
    out += "<ul>";
    out += "<li>Zleć gotowiec: <strong>chirurgia planówka do zabiegu</strong></li>";
    if (tarczyca) out += "<li><strong class='highlight-red'>Choroby tarczycy:</strong> Dopisz TSH, ft3, ft4 do badań!</li>";
    if (cukrzyca) out += "<li><strong class='highlight-red'>Cukrzyca:</strong> Wpisz <strong>DPC</strong> w polu badań/konsultacji!</li>";
    if (zabieg === "cholecystektomia") out += "<li><strong class='highlight-red'>Cholecystektomia:</strong> Zleć konsultację <strong>Dietetyka</strong>.</li>";
    
    if (zabieg === "endoskopia") {
        out += "<li><strong>Grupa krwi:</strong> <span class='highlight-red'>NIE ZLECAJ grupy krwi na kolonoskopię/gastroskopię.</span></li>";
    } else {
        if (grupa) {
            out += "<li><strong>Grupa krwi:</strong> Zaznacz pole 'wszystkie' w badaniach i wpisz w uwagach: <strong>odpis z dn. XX.YY.ZZZZ</strong></li>";
        } else {
            out += "<li><strong>Grupa krwi:</strong> Brak potwierdzonego wyniku -> Zleć pobranie!</li>";
        }
        out += "<li>Wydrukuj formularz 'Grupa krwi' z zakładki 'epikryza'.</li>";
    }
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>4️⃣ Zlecenia Jednorazowe (w systemie i na karcie papierowej)</h3>";
    out += "<ul>";
    if (cisnienie) {
        out += "<li><strong class='highlight-red'>SBP >180:</strong> Zleć <strong>Captopril 12,5/25mg s.l.</strong><br>";
        out += "-> Wpisz na karcie godzinę pomiaru i wynik (np. 180/110).<br>";
        out += "-> Podbij się za osobą podającą lek i wpisz godz. podania!</li>";
    }
    if (zabieg === "endoskopia") {
        out += "<li><strong>Kolonoskopia:</strong> Zleć <strong>Eziclen p.o. 15:00 i 20:00</strong> (na 2 osobnych kratkach).</li>";
    } else if (zabieg === "jelito") {
        out += "<li><strong>Chirurgia grubego (Hemikolektomia, Resekcja):</strong><br>";
        out += " - Eziclen p.o. 15:00 i 20:00<br>";
        out += " - Biofazolin 2,0g i.v. oraz Metronidazol 500mg i.v. na blok operacyjny.</li>";
    } else if (zabieg === "prokto") {
        out += "<li><strong>Zabieg proktologiczny:</strong> Zleć <strong>lewatywę</strong> jednorazowo.</li>";
    } else {
        out += "<li>Zleć profilaktykę antybiotykową/płyny wedle uznania/wymagań operacji.</li>";
    }
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>5️⃣ Karta Leków Stałych (Tabela A3)</h3>";
    out += "<ul>";
    out += "<li><strong class='highlight-red'>Czego NIE wpisujemy:</strong> leków p/krzepliwych pacjenta, p/płytkowych, insuliny, p/cukrzycowych, wziewów, witamin i suplementów (w tym żelaza).</li>";
    if (poranny) {
        out += "<li><strong class='highlight-red'>Pacjent zażył poranny lek!</strong> Zaznacz <strong>'Ø'</strong> przy dawce na 8:00, aby pielęgniarka nie podała drugi raz!</li>";
    }
    if (caprini) {
        out += "<li><strong class='highlight-red'>Caprini >= 3 pkt:</strong> Zleć <strong>Neoparin 0,4ml s.c. 0-0-1 20:00</strong>.</li>";
    }
    out += "<li><em>Ściąga rozpisywania godzin:</em><br> p.o. 1-1-1 (8-14-18) <br> i.v. 1-1-1 (6-14-22) lub 1-1-1-1 (6-12-18-24).</li>";
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>6️⃣ Dokumenty z Koperty (Wyciągnij)</h3>";
    out += "<ul>";
    out += "<li>Karta zleceń jednorazowych</li>";
    out += "<li>Karta badań i konsultacji</li>";
    out += "<li>Karta zleceń stałych (tabela A3)</li>";
    out += "<li>Kwalifikacja stanu odżywienia NRS</li>";
    out += "<li>Kwalifikacja ryzyka zakażenia</li>";
    out += "</ul>";
    out += "</div>";

    out += "<div class='guide-step'>";
    out += "<h3>7️⃣ Wydruki z systemu (Epikryza -> Wydruki -> Kod 360)</h3>";
    out += "<ul>";
    
    if (zabieg === "endoskopia" || zabieg === "bezzabiegowe") {
        out += "<li>Skala Caprini</li>";
    } else {
        out += "<li>Kwalifikacja do zabiegu (zabiegi operacyjne, port, ECPW, balon)</li>";
    }
    if (wiek) {
        out += "<li>Skala oceny geriatrycznej (dla pacjentów > 60 r.ż.)</li>";
    }
    out += "<li><strong>Karta badania przedmiotowego</strong> -> Wydrukuj i podbij.</li>";
    
    if (zabieg === "endoskopia") {
        out += "<li><strong class='highlight-red'>2x Odpowiednia zgoda</strong> (kolo/gastro, ECPW).<br>";
        out += "-> <strong>OBOWIĄZKOWO</strong> na wydruku zgody musi być wpisany powód badania!<br>";
        out += "-> Wypełnić ankietę z pacjentem w każdej ze zgód.</li>";
    } else {
        out += "<li>Odpowiednie zgody operacyjne i ankieta znieczuleniowa.</li>";
    }
    
    out += "</ul>";
    out += "</div>";
    
    out += "<div style='font-weight: bold; font-size: 1.1em; color: #e74c3c; padding: 10px; text-align: center; border: 2px dashed #e74c3c;'>W razie wątpliwości - dzwonić po pomoc 'dużego' lekarza (283)</div>";

    let guideBox = document.getElementById("dynamic-guide");
    if(guideBox) guideBox.innerHTML = out;
}
