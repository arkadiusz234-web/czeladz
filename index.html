<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Czeladź Staż</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Strona stażowa">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Google Fonts: Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  
  <!-- Docsify Dark Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <!-- Custom High Contrast & Typography -->
  <style>
    :root {
      /* Colors */
      --theme-color: #4DBA87;
      --base-color: #f8f9fa; /* High contrast text */
      --base-background-color: #121212; /* Deep dark background */
      
      /* Sidebar */
      --sidebar-background: #0a0a0a;
      --sidebar-nav-link-color: #e0e0e0;
      --sidebar-nav-link-color--active: var(--theme-color);
      --sidebar-nav-pagelink-background: inherit;
      
      /* Headings & Links */
      --heading-color: #ffffff;
      --link-color: var(--theme-color);
      --link-text-decoration: underline;
      
      /* Other */
      --blockquote-color: #d1d5db;
      --blockquote-border-color: var(--theme-color);
      --code-color: #e2e8f0;
      --code-theme-background: #1e1e1e;
    }
    
    body {
      font-family: 'Merriweather', serif !important;
      line-height: 1.8;
      font-size: 17px;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Merriweather', serif !important;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .sidebar {
      font-family: 'Merriweather', serif !important;
    }
    
    /* Zwiększenie widoczności paska bocznego dla wygody czytania */
    .sidebar-nav li>a {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">Ładowanie...</div>
  <script>
    window.$docsify = {
      name: 'Czeladź Staż',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: true // to execute scripts inside markdown if needed
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
