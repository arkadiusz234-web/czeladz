<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Czeladź Staż</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Strona stażowa">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Google Fonts: Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  
  <!-- Docsify Darklight Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" type="text/css" />

  <style>
    /* Dodatkowy kontrast czcionki dla obu trybów */
    body {
      font-family: 'Merriweather', serif !important;
      line-height: 1.8;
    }
    
    h1, h2, h3, h4, h5, h6, .sidebar {
      font-family: 'Merriweather', serif !important;
    }
    
    .sidebar-nav li>a {
      font-size: 16.5px;
      font-weight: 500;
    }
    
    /* Bardziej widoczne linki w tekście */
    .markdown-section a:not([class]) {
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">Ładowanie...</div>
  <script>
    window.$docsify = {
      name: 'Czeladź Staż',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: true,
      darklightTheme: {
        siteFont : 'Merriweather, serif',
        defaultTheme : 'dark',
        codeFontFamily : 'monospace',
        bodyFontSize : '18px',
        dark: {
          accent: '#4DBA87',
          toogleBackground : '#ffffff',
          background: '#000000',      /* Głęboka czerń */
          textColor: '#ffffff',       /* Czysta biel */
          codeTextColor : '#ffffff',
          codeBackgroundColor : '#1a1a1a',
          borderColor : '#4DBA87',
          blockQuoteColor : '#e0e0e0',
          highlightColor : '#4DBA87',
          sidebarSublink : '#ffffff', /* Ekstremalnie białe linki boczne */
          codeTypeColor : '#ffffff',
          coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage : 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        },
        light: {
          accent: '#18784e',
          toogleBackground : '#000000',
          background: '#ffffff',
          textColor: '#000000',       /* Totalnie czarny tekst w trybie jasnym */
          codeTextColor : '#000000',
          codeBackgroundColor : '#f0f0f0',
          borderColor : '#000000',
          blockQuoteColor : '#333333',
          highlightColor : '#18784e',
          sidebarSublink : '#000000', /* Czarne menu w jasnym trybie */
          codeTypeColor : '#000000',
          coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage : 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        }
      }
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Docsify Darklight Theme Script -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
</html>
